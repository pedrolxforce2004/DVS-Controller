<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DVS Controller - Login</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="mark">DVS</div>
    <h1>DVS Controller</h1>
    <p>Decode Video Server</p>
    <form id="loginForm">
      <input name="user" value="admin" autocomplete="username" required>
      <input name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
